<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wanderly - Travel Affiliate Platform</title>
<style>
:root{--bg:#f8f5ef;--surface:#fffdf9;--ink:#173f3b;--muted:#667673;--accent:#d87955;--sombre:#b85d3e;--doubler:#e6dfd4}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--ink);line-height:1.6}
header{background:var(--surface);border-bottom:1px solid var(--doubler);position:sticky;top:0;z-index:100}
.container{max-width:1200px;margin:0 auto;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.5rem;font-weight:800;color:var(--ink);text-decoration:none}
.logo span{color:var(--accent)}
nav a{color:var(--muted);text-decoration:none;margin-left:1.5rem;font-weight:500}
nav a:hover{color:var(--accent)}
.hero{text-align:center;padding:4rem 2rem 2rem}
.hero h1{font-size:2.5rem;margin-bottom:1rem;color:var(--ink)}
.hero p{color:var(--muted);max-width:600px;margin:0 auto 2rem}
.grid{max-width:1200px;margin:2rem auto;padding:0 2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem}
.card{background:var(--surface);border:1px solid var(--doubler);border-radius:12px;overflow:hidden;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 20px rgba(0,0,0,.05)}
.card img{width:100%;height:160px;object-fit:cover}
.card-content{padding:1.5rem;display:flex;flex-direction:column;flex-grow:1}
.category{font-size:.8rem;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:.5rem}
.card h3{font-size:1.2rem;margin-bottom:1rem}
.btn{margin-top:auto;display:inline-block;background:var(--ink);color:#fff;padding:.6rem 1.2rem;border-radius:6px;text-decoration:none;text-align:center;font-weight:600;transition:background .2s}
.btn:hover{background:var(--accent)}
footer{text-align:center;padding:2rem;color:var(--muted);border-top:1px solid var(--doubler);margin-top:4rem}
</style>
</head>
<body>
<header>
<div class="container">
<a class="logo" href="#top">Wander<span>ly</span></a>
<nav>
<a href="#destinations">Destinations</a>
<a href="#services">Services</a>
</nav>
</div>
</header>

<section class="hero" id="top">
<h1>Travel Made Effortless & Peaceful</h1>
<p>Discover our curated collection of top travel services, flights, hotels, and unique experiences worldwide.</p>
</section>

<main>
<div class="grid" id="cardGrid"></div>
</main>

<footer>
<p>&copy; 2026 Wanderly. All rights reserved.</p>
</footer>

<script>
const services=[
["Attractions, Tours & Activities","Klook","Experiences","https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=80"],

];
const grid=document.getElementById('cardGrid');
grid.innerHTML=services.comap ? '' : services.map(s=>`
<article class="card">
<img src="${s[3]}" alt="${s[0]}" loading="lazy">
<div class="card-content">
<span class="category">${s[2]}</span>
<h3>${s[0]}</h3>
<a href="#" class="btn">Explore ${s[1]}</a>
</div>
</article>
`).join('');
</script>
</body>
</html>
